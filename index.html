<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Space — The Enabling Technology Behind Orbital Data Centers</title>
<meta name="description" content="Plasma power and propulsion, connected by high-bandwidth laser links.">
<link rel="icon" href="assets/logos/logo.svg">
<link rel="stylesheet" href="css/style.css">
<script>
/*
 * The design is drawn on 1440x810 frames. A frame stretches to fill the window
 * — video and nav go edge to edge, and the copy keeps its designed insets —
 * down to MIN_WIDTH. Below that there is no room left to stretch into, so the
 * whole frame is scaled down instead of re-laid out, which holds every padding
 * and margin at its designed ratio.
 *
 * `--frame-width` is published because the quarter-turned video in the hero is
 * sized off the frame width, and a rotated box cannot derive that from
 * percentages.
 *
 * Runs before first paint so nothing jumps.
 */
(function () {
  var MIN_WIDTH = 900;
  var set = function () {
    var width = Math.max(document.documentElement.clientWidth, MIN_WIDTH);
    var style = document.documentElement.style;
    style.setProperty('--frame-scale', Math.min(1, window.innerWidth / MIN_WIDTH));
    style.setProperty('--frame-width', width + 'px');
  };
  set();
  addEventListener('resize', set);
})();
</script>
</head>
<body>

<!-- =====================================================================
     Figma: "section 1" (235:2775) — 1440 x 810.

     Video 1 plays on load, video 2 follows it for a couple of seconds, and
     from there the scroll drives video 2 to its white-out, which is what hands
     over to the section below. See js/scene.js.
     ===================================================================== -->
<div class="scene" data-scene="hero">
  <div class="scene__stage">
    <div class="frame" data-node-id="235:2775" data-design-frame>

      <div class="frame__bg" aria-hidden="true">

          <source src="assets/videos/video-1.webm" type="video/webm">
        </video>

        <!-- Video 2, kept in the quarter-turned crop it was placed in. -->
        <div class="frame__strip" data-hero-layer="2">
          <video class="frame__video" data-hero-video="2" muted playsinline preload="auto">
            <source src="assets/videos/video-2.mp4" type="video/mp4">
            <source src="assets/videos/video-2.webm" type="video/webm">
          </video>
        </div>
      </div>

      <!-- Figma: "Frame 2147227336" (235:2779) — 1360 x 64, inset 40/20 -->
      <header class="header" data-node-id="235:2779">
        <div class="header__leading" data-node-id="235:2780">

          <a class="header__logo" href="/" aria-label="Core Space — home" data-node-id="235:2781">
            <img src="assets/logos/logo.svg" alt="" width="34" height="34">
          </a>

          <nav class="nav" data-node-id="235:2786">
            <a class="nav__link" href="#technology" data-node-id="235:2787">TECHNOLOGY</a>
            <a class="nav__link" href="#company" data-node-id="235:2788">COMPANY</a>
            <a class="nav__link" href="#newsroom" data-node-id="235:2789">NEWSROOM</a>
            <a class="nav__link" href="#investors" data-node-id="235:2790">FOR INVESTORS</a>
            <a class="nav__link" href="#contact" data-node-id="235:2791">CONTACT</a>
          </nav>

        </div>

        <a class="partner" href="#partner" data-node-id="235:2792">
          <img class="partner__shape" src="assets/icons/btn-become-a-partner.svg"
               alt="" width="140" height="34" data-node-id="235:2793">
          <span class="partner__label" data-node-id="235:2794">BECOME A PARTNER</span>
        </a>
      </header>

      <div class="hero__flash" data-hero-flash aria-hidden="true"></div>

      <!-- Both blocks clear out together as the scroll takes over the camera. -->
      <div data-scene-copy>

        <!-- Figma: "title" (235:2807) -->
        <div class="hero__title" data-node-id="235:2807">
          <h1 class="hero__headline" data-node-id="235:2808">The enabling<br>technology behind <br>orbital data centers</h1>
        </div>

        <!-- Figma: "Frame 2147227359" (235:2816) -->
        <div class="hero__footer" data-node-id="235:2816">
          <p class="hero__subhead" data-node-id="235:2814">Plasma power and propulsion, connected by high-bandwidth laser links</p>

          <div class="hero__actions" data-node-id="235:2802">
            <a class="explore" href="#technology" data-node-id="235:2803">
              <span class="explore__inner" data-node-id="235:2804">
                <img class="explore__shape" src="assets/icons/btn-explore-base.svg"
                     alt="" width="175" height="50" data-node-id="235:2805">
                <span class="explore__label" data-node-id="235:2806">EXPLORE TECHNOLOGY</span>
              </span>
            </a>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>


<!-- =====================================================================
     Figma: "section 2" (238:2674) into "section 2.1" (242:2673) — 1440 x 810.

     Same frame twice: the statement starts mostly dimmed and fills in reading

</div>

<script src="js/scene.js"></script>

</body>
</html>
