<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Space — The Enabling Technology Behind Orbital Data Centers</title>
<meta name="description" content="Plasma power and propulsion, connected by high-bandwidth laser links.">
<link rel="icon" href="assets/logos/logo.svg">
<link rel="stylesheet" href="css/style.css">
<script>
/*
 * The design is drawn on a 1440x810 frame. The frame stretches to fill the
 * window — the video and the nav go edge to edge, and the copy keeps its
 * designed measure — down to MIN_WIDTH. Below that there is no room left to
 * stretch into, so the whole frame is scaled down instead of re-laid out, which
 * holds every padding and margin at its designed ratio.
 *
 * `--frame-width` is published because the rotated video is sized off the frame
 * width, and a rotated box cannot derive that from percentages.
 *
 * Runs before first paint so nothing jumps.
 */
(function () {
  var MIN_WIDTH = 900;
  var set = function () {
    var width = Math.max(document.documentElement.clientWidth, MIN_WIDTH);
    var style = document.documentElement.style;
    style.setProperty('--frame-scale', Math.min(1, window.innerWidth / MIN_WIDTH));
    style.setProperty('--frame-width', width + 'px');
  };
  set();
  addEventListener('resize', set);
})();
</script>
</head>
<body>

<!-- Figma: "Concept 17" (183:3313) — 1440 x 810.
     data-node-id on each element names the Figma node it came from.

     The section is taller than the window and the stage inside it is pinned;
     that extra height is the scroll the camera move is mapped onto. See
     js/scene.js. -->
<div class="scene" data-scene>
  <div class="scene__stage">
    <div class="frame" data-node-id="183:3313" data-design-frame>

      <!-- 201:3101 — the clip is turned a quarter turn and cropped to the
           frame, which brings the planet up as a horizon along the bottom.
           Plays at full opacity, no overlay. -->
      <div class="frame__bg" aria-hidden="true">
        <div class="frame__strip">
          <video class="frame__video" data-scene-video muted playsinline preload="auto"
                 poster="assets/videos/hero-scene-poster.jpg">
            <source src="assets/videos/hero-scene.webm" type="video/webm">
            <source src="assets/videos/hero-scene.mp4" type="video/mp4">
          </video>
        </div>
      </div>

      <!-- Figma: "Frame 2147227336" (201:3081) — 1360 x 64, inset 40/20 -->
      <header class="header" data-node-id="201:3081" data-scene-chrome>
        <div class="header__leading" data-node-id="201:3082">

          <a class="header__logo" href="/" aria-label="Core Space — home" data-node-id="201:3083">
            <img src="assets/logos/logo.svg" alt="" width="34" height="34">
          </a>

          <nav class="nav" data-node-id="201:3088">
            <a class="nav__link" href="#technology" data-node-id="201:3089">TECHNOLOGY</a>
            <a class="nav__link" href="#company" data-node-id="201:3090">COMPANY</a>
            <a class="nav__link" href="#newsroom" data-node-id="201:3091">NEWSROOM</a>
            <a class="nav__link" href="#investors" data-node-id="201:3092">FOR INVESTORS</a>
            <a class="nav__link" href="#contact" data-node-id="201:3093">CONTACT</a>
          </nav>

        </div>

        <a class="partner" href="#partner" data-node-id="201:3094">
          <img class="partner__shape" src="assets/icons/btn-become-a-partner.svg"
               alt="" width="140" height="34" data-node-id="201:3095">
          <span class="partner__label" data-node-id="201:3096">BECOME A PARTNER</span>
        </a>
      </header>

      <!-- Figma: "Frame 2147227351" (201:3127) — clears out as the scroll takes
           over the camera. -->
      <div class="hero" data-node-id="201:3127" data-scene-copy>

        <p class="hero__eyebrow" data-node-id="201:3125">[NEXT-GENERATION ORBITAL SYSTEMS]</p>

        <div class="hero__body" data-node-id="201:3098">

          <div class="hero__headlineRow" data-node-id="201:3069">
            <div data-node-id="201:3070">
              <h1 class="hero__headline" data-node-id="201:3071">The enabling technology behind orbital data centers</h1>
            </div>
          </div>

          <div class="hero__lede" data-node-id="201:3073">
            <p class="hero__subhead" data-node-id="201:3074">Plasma power and propulsion, connected by high-bandwidth laser links</p>

            <div class="hero__actions" data-node-id="201:3075">
              <a class="explore" href="#technology" data-node-id="201:3076">
                <span class="explore__inner" data-node-id="201:3077">
                  <!-- 201:3135 / 201:3136 — the two blurred ellipses that pool
                       light behind the button. -->
                  <img class="explore__glowSoft" src="assets/icons/glow-soft.svg"
                       alt="" width="214" height="160" data-node-id="201:3135">
                  <img class="explore__glowCore" src="assets/icons/glow-core.svg"
                       alt="" width="134" height="72" data-node-id="201:3136">

                  <img class="explore__shape" src="assets/icons/btn-explore-base.svg"
                       alt="" width="175" height="50" data-node-id="201:3078">
                  <img class="explore__shape" src="assets/icons/btn-explore-glow.svg"
                       alt="" width="175" height="50" data-node-id="201:3133">

                  <span class="explore__label" data-node-id="201:3079">EXPLORE TECHNOLOGY</span>
                </span>
              </a>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/scene.js"></script>

</body>
</html>
